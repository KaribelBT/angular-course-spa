<h1 class="row animated fadeIn fast">
    {{ heroe.nombre | uppercase }}
    <small>({{ heroe.aparicion | date: 'y' }})</small>
</h1>
<hr>

<div class="row animated fadeIn">
    <div class="col-md-4">
        <img [src]="heroe.img" class="img-fluid" [alt]="heroe.nombre">
        <br><br>
        <button (click)="regresarHeroes()" class="btn btn-outline-danger btn-block">Regresar</button>
    </div>
    <div class="col-md-8">
        <h3>{{ heroe.nombre }}</h3>
        <hr>
        <p>{{ heroe.bio }}</p>
        <div>
            <img *ngIf="heroe.casa=='Marvel'" src="assets/img/marvel.png" class="img-logo" alt="Marvel">
            <img *ngIf="heroe.casa=='DC'" src="assets/img/dc.png" class="img-logo" alt="DC">
        </div>
    </div>
</div>
